# 日常开发使用默认 host 工具链（glibc），产物在 target/debug|release 下，
# 与普通 Rust 项目行为一致，无需任何额外配置。
#
# 发布时构建静态 musl 版（不依赖目标系统 glibc 版本，可在任何 x86_64
# Linux 上直接运行）：
#   bash scripts/release.sh
# 或手动执行：
#   cargo build --release --target x86_64-unknown-linux-musl -p ash-cli
#
# 需要本机已安装 musl 工具链：
#   rustup target add x86_64-unknown-linux-musl
#   Arch:      sudo pacman -S musl
#   Debian/Ubuntu: sudo apt install musl-tools
