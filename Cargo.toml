[workspace]
resolver = "2"
members = [
    "crates/ash-core",
    "crates/ash-protocol",
    "crates/ash-tools",
    "crates/ash-agent",
    "crates/ash-collab",
    "crates/ash-workflow",
    "crates/ash-tui",
    "crates/ash-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Internal
ash-core = { path = "crates/ash-core" }
ash-protocol = { path = "crates/ash-protocol" }
ash-tools = { path = "crates/ash-tools" }
ash-agent = { path = "crates/ash-agent" }
ash-collab = { path = "crates/ash-collab" }
ash-workflow = { path = "crates/ash-workflow" }
ash-tui = { path = "crates/ash-tui" }

# Async
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
futures = "0.3.33"
async-stream = "0.3.6"

# HTTP
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
eventsource-stream = "0.2.3"

# Serialization
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
serde_yaml = { package = "serde_yaml_ng", version = "0.10.0" }

# CLI / TUI
clap = { version = "4.6.4", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm",
    "unstable-backend-writer",
    "unstable-rendered-line-info",
] }
owo-colors = "4.3.0"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
pulldown-cmark = "0.13.4"

# Type system
strum = { version = "0.28.0", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["display", "from", "into", "deref", "constructor"] }
schemars = "1.2.2"

# Error
thiserror = "2.0.19"
anyhow = "1.0.104"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Infrastructure
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
secrecy = { version = "0.10.3", features = ["serde"] }
directories = "6.0.0"
async-trait = "0.1.91"
rustix = "1.1.4"

# Tools
tempfile = "3.27.0"
base64 = "0.23.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
htmd = "0.5.5"
ignore = "0.4.31"
regex = "1.13.1"

# MCP
rmcp = { version = "3.0.1", features = ["client", "transport-io", "transport-child-process"] }

# Testing
insta = { version = "1.48.0", features = ["json", "redactions"] }
